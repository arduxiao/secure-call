services:
  - type: web
    name: secure-call
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Signaling CORS allow-list. Server also accepts RENDER_EXTERNAL_URL automatically,
      # so this is defense-in-depth. Use a comma-separated list to add staging/preview origins.
      - key: ALLOWED_ORIGIN
        value: https://secure-call-kn0h.onrender.com
